[package]
name = "iksemel"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Süleyman Poyraz", "Gurer Ozen"]
description = "Fast, memory-safe XML parser and modern XMPP protocol library for Rust"
license = "LGPL-2.1"
readme = "README.md"
repository = "https://github.com/Zaryob/iksemel-rs"
documentation = "https://docs.rs/iksemel"
keywords = ["xml", "xmpp", "parser", "scram", "jabber"]
categories = ["parser-implementations", "network-programming"]

[lib]
name = "iksemel"           # The name of the target.
path = "src/lib.rs"    # The source file of the target.

[dependencies]
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
sha1 = "0.11"
hex = "0.4"
tokio = { version = "1.53", features = ["full"] }
native-tls = "0.2.18"
tokio-native-tls = "0.3"
serde = { version = "1.0.229", optional = true, features = ["derive"] }
hmac = "0.13"
sha2 = "0.11"
md-5 = "0.11"
idna = "1.1"
stringprep = "0.1.5"
getrandom = "0.4"

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
quick-xml = "0.42.0"
roxmltree = "0.21.1"
serde_json = "1.0.151"
xml-rs = "1.0.0"

[[bin]]
name = "ikslint"
path = "tools/ikslint.rs"

[[bin]]
name = "iksperf"
path = "tools/iksperf.rs"

[[bin]]
name = "iksroster"
path = "tools/iksroster.rs"

[[bench]]
name = "comparison"
path = "benches/comparison.rs"
harness = false

[workspace]
members = ["ffi"]
default-members = ["."]
resolver = "2"
