[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iksemel-rs"
version = "0.3.6"
description = "Python binding for the Rust-backed iksemel C ABI"
requires-python = ">=3.9"
license = {text = "LGPL-2.1"}

[tool.setuptools.packages.find]
where = ["."]
include = ["iksemel"]
