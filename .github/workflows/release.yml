name: Release

# Cuts a release whenever master carries a version with no release yet (or a v* tag is pushed);
# a failed release is retried by the next push to master.
# verify -> tag vX.Y.Z -> GitHub Release (notes from CHANGELOG.md) -> crates.io (if token set).
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
      gh_release: ${{ steps.meta.outputs.gh_release }}
      crate: ${{ steps.meta.outputs.crate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Read version and check tag/release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

          # Each target is checked on its own so a partial failure is retried next push.
          gh_release=true; crate=true
          gh release view "$tag" >/dev/null 2>&1 && gh_release=false
          curl -sf -A "iksemel-rs release workflow" \
            "https://crates.io/api/v1/crates/iksemel/$version" >/dev/null && crate=false
          echo "gh_release=$gh_release" >> "$GITHUB_OUTPUT"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          if [[ $gh_release == false && $crate == false ]]; then
            echo "$tag is already released on GitHub and crates.io; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every manifest in the repo must carry the same version.
          for f in ffi/Cargo.toml python/pyproject.toml; do
            if [[ -f "$f" ]] && ! grep -q "^version = \"$version\"" "$f"; then
              echo "::error file=$f::version does not match Cargo.toml ($version)"
              exit 1
            fi
          done

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::missing '## [$version]' section"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify on ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Doc tests
        run: cargo test --doc --all-features

  release:
    name: Tag and publish ${{ needs.prepare.outputs.tag }}
    needs: [ prepare, verify ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Create tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already on origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^---$/ { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Package crate
        run: cargo package -p iksemel

      - name: Create GitHub release
        if: needs.prepare.outputs.gh_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            "target/package/iksemel-$VERSION.crate"

      - name: Publish to crates.io
        if: needs.prepare.outputs.crate == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret not set; skipping crates.io publish."
            exit 0
          fi
          cargo publish -p iksemel
